<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAX VIDEO</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
        }
        
        .video-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        .video-card:active {
            transform: scale(0.98);
        }
        
        .gradient-text {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .new-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- হেডার -->
    <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center font-bold text-white text-sm shadow-lg shadow-blue-500/20">M</div>
            <h1 class="text-xl font-bold gradient-text tracking-wide">MAX VIDEO</h1>
        </div>
        <div class="text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-full border border-emerald-500/20 flex items-center gap-1.5">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span id="liveUsers">0</span> Online
        </div>
    </header>

    <!-- ভিডিও গ্রিড -->
    <main class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="videoGrid">
        <div class="col-span-full flex justify-center py-10">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
        </div>
    </main>

    <script>
        // ==========================================
        // ১. FIREBASE কনফিগারেশন
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAURHMhEujBMzXEVLaIyGj1ZtzLKvzqsX8",
            authDomain: "taskobd.firebaseapp.com",
            databaseURL: "https://taskobd-default-rtdb.firebaseio.com",
            projectId: "taskobd",
            storageBucket: "taskobd.firebasestorage.app",
            messagingSenderId: "652647586734",
            appId: "1:652647586734:web:cf3acd543cf4373952063f",
            measurementId: "G-4NVCSMVNKY"
        };

        let db = null;
        let firebaseReady = false;
        
        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                firebaseReady = true;
            }
        } catch (e) {
            console.error("Firebase error:", e);
        }

        // ==========================================
        // ২. টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজেশন
        // ==========================================
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0f172a');
            tg.setBackgroundColor('#0f172a');
        }

        // ==========================================
        // ৩. ১ ঘন্টা ট্র্যাকিং
        // ==========================================
        const COOLDOWN_TIME = 60 * 60 * 1000; 
        const COOLDOWN_KEY = 'maxvideo_ad_cooldown';

        function getLastWatched(videoId) {
            try {
                const data = JSON.parse(localStorage.getItem(COOLDOWN_KEY) || '{}');
                return data[videoId] || 0;
            } catch {
                return 0;
            }
        }

        function setWatched(videoId) {
            const data = JSON.parse(localStorage.getItem(COOLDOWN_KEY) || '{}');
            data[videoId] = Date.now();
            localStorage.setItem(COOLDOWN_KEY, JSON.stringify(data));
        }

        function shouldShowAd(videoId) {
            const lastWatched = getLastWatched(videoId);
            return (Date.now() - lastWatched) > COOLDOWN_TIME;
        }

        // ==========================================
        // ৪. ভিডিও লোড করা (JavaScript দিয়ে সর্ট - নতুন ভিডিও সবার উপরে)
        // ==========================================
        async function loadVideos() {
            const grid = document.getElementById('videoGrid');
            
            if (!firebaseReady) {
                grid.innerHTML = '<p class="col-span-full text-center text-red-400 py-10">Firebase কানেক্ট হয়নি। কনফিগ চেক করুন।</p>';
                return;
            }
            
            try {
                // শুধু isActive=true ভিডিও লোড করি (orderBy ছাড়া)
                const snapshot = await db.collection('videos')
                                         .where('isActive', '==', true)
                                         .get();
                
                if (snapshot.empty) {
                    grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-10">এখনো কোনো ভিডিও যোগ করা হয়নি।</p>';
                    return;
                }

                const videos = [];
                const now = Date.now();
                const oneDay = 24 * 60 * 60 * 1000; // ২৪ ঘন্টা
                
                snapshot.forEach(doc => {
                    const videoData = { id: doc.id, ...doc.data() };
                    
                    // createdAt থেকে timestamp বের করা
                    let videoTimestamp = 0;
                    if (videoData.createdAt && videoData.createdAt.toDate) {
                        videoTimestamp = videoData.createdAt.toDate().getTime();
                    } else if (videoData.createdAt && typeof videoData.createdAt === 'number') {
                        videoTimestamp = videoData.createdAt;
                    }
                    
                    // যদি আজ বা গত ২৪ ঘন্টার মধ্যে আপলোড করা হয়
                    videoData.isNew = (now - videoTimestamp) < oneDay;
                    videoData.timestamp = videoTimestamp;
                    
                    videos.push(videoData);
                });

                // ⚠️ JavaScript দিয়ে সর্ট - নতুন ভিডিও সবার উপরে
                videos.sort((a, b) => {
                    // প্রথমে createdAt দিয়ে সর্ট (নতুন আগে)
                    return b.timestamp - a.timestamp;
                });

                // ভিডিও কার্ড রেন্ডার
                grid.innerHTML = videos.map(video => `
                    <div class="video-card bg-slate-800 rounded-xl overflow-hidden border border-slate-700 relative" 
                         id="card-${video.id}"
                         onclick="handleVideoClick('${video.id}')">
                        
                        ${video.isNew ? '<span class="new-badge">🔥 NEW</span>' : ''}
                        
                        <!-- মিডিয়া কন্টেইনার -->
                        <div class="relative aspect-video bg-slate-900" id="media-${video.id}">
                            <img src="${video.thumbnail}" 
                                 alt="${video.title}" 
                                 class="w-full h-full object-cover"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23334155%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22 font-size=%2240%22>🎬</text></svg>'">
                            
                            <!-- প্লে আইকন -->
                            <div class="absolute inset-0 flex items-center justify-center bg-black/20 pointer-events-none">
                                <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center">
                                    <svg class="w-7 h-7 text-white ml-1" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                        
                        <!-- ভিডিও ইনফো -->
                        <div class="p-3.5">
                            <h3 class="font-semibold text-white text-sm line-clamp-2 mb-2 leading-snug">${video.title}</h3>
                            <div class="flex items-center justify-between text-xs text-slate-400 border-t border-slate-700 pt-2.5">
                                <span> ${video.fakeViews || '0'}</span>
                                <span>❤ ${video.fakeLikes || '0'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error("Error loading videos:", error);
                grid.innerHTML = '<p class="col-span-full text-center text-red-400 py-10">ডেটা লোড করতে সমস্যা হয়েছে।</p>';
            }
        }

        // ==========================================
        // ৫. ভিডিও ক্লিক হ্যান্ডেলার
        // ==========================================
        async function handleVideoClick(videoId) {
            const mediaContainer = document.getElementById(`media-${videoId}`);
            
            if (mediaContainer.querySelector('iframe')) {
                return; 
            }
            
            if (shouldShowAd(videoId)) {
                try {
                    const doc = await db.collection('videos').doc(videoId).get();
                    const video = { id: doc.id, ...doc.data() };
                    
                    if (video.adLink) {
                        window.open(video.adLink, '_blank');
                        setWatched(videoId);
                        db.collection('videos').doc(videoId).update({
                            realViews: firebase.firestore.FieldValue.increment(1)
                        }).catch(() => {});
                    }
                } catch (e) {
                    console.error("Ad click error:", e);
                }
            } else {
                playVideoInPlace(videoId, mediaContainer);
            }
        }

        // ==========================================
        // ৬. ভিডিও প্লে করা
        // ==========================================
        async function playVideoInPlace(videoId, container) {
            try {
                const doc = await db.collection('videos').doc(videoId).get();
                const video = { id: doc.id, ...doc.data() };
                
                container.innerHTML = `
                    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; border-radius: 8px; background: #000;">
                        <iframe 
                            src="https://drive.google.com/file/d/${video.driveId}/preview" 
                            style="position: absolute; top: -60px; left: 0; width: 100%; height: calc(100% + 115px); border: 0;"
                            allow="autoplay; encrypted-media" 
                            allowfullscreen>
                        </iframe>
                    </div>
                `;
                
                db.collection('videos').doc(videoId).update({
                    completedViews: firebase.firestore.FieldValue.increment(1)
                }).catch(() => {});
                
            } catch (e) {
                console.error("Play video error:", e);
            }
        }

        // ==========================================
        // ৭. লাইভ ইউজার ট্র্যাকিং
        // ==========================================
        function trackActiveUser() {
            if (!db) return;

            let sessionId = sessionStorage.getItem('live_session_id');
            if (!sessionId) {
                sessionId = (window.crypto && window.crypto.randomUUID) 
                    ? window.crypto.randomUUID() 
                    : Date.now().toString(36) + Math.random().toString(36).substr(2);
                sessionStorage.setItem('live_session_id', sessionId);
            }

            const presenceRef = db.collection('presence').doc(sessionId);

            function updatePresence() {
                presenceRef.set({
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                    isOnline: true
                }, { merge: true }).catch(err => console.error("Presence update failed:", err));
            }

            updatePresence();
            setInterval(updatePresence, 60000);

            window.addEventListener('beforeunload', () => {
                updatePresence();
            });

            const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000);
            db.collection('presence')
              .where('lastSeen', '>', fiveMinutesAgo)
              .onSnapshot((snapshot) => {
                  document.getElementById('liveUsers').innerText = snapshot.size;
              }, (error) => {
                  if (error.code !== 'failed-precondition') {
                      console.error("Live users fetch error:", error);
                  }
              });
        }

        // ==========================================
        // ৮. ইনিশিয়ালাইজেশন
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadVideos();
            trackActiveUser();
        });
    </script>
</body>
</html>
